<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}: {{ site.description }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | strip_newlines | escape }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta name="theme-color" content="#f0603f">
<link rel="icon" href="{{ '/assets/ring.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.extra_css %}<link rel="stylesheet" href="{{ page.extra_css | relative_url }}">
{% endif %}{% feed_meta %}
</head>
<body class="{{ page.layout }}">
{% unless page.url == "/" %}
<header class="top"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/ring.svg' | relative_url }}" alt="" width="22" height="22">Semnal</a>
</div></header>
{% endunless %}

{{ content }}

<footer class="foot"><div class="wrap">
  <p>Questions, bug reports, or ideas? <a href="mailto:beta@semnal.me">beta@semnal.me</a></p>
  <p><a href="{{ '/privacy' | relative_url }}">Privacy Policy</a>·<a href="{{ '/terms' | relative_url }}">Terms</a>·<a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
</div></footer>
</body>
</html>
